const MARQUEE_ITEMS = "GRAPHIC DESIGN · VIDEO EDITING · VISUAL IDENTITY · REELS CONTENT · ART DIRECTION · BRAND STRATEGY";

function BlurText({ text, className, stagger = 80, style, active }) {
  const [visible, setVisible] = React.useState(active === undefined ? false : !!active);
  const ref = React.useRef(null);

  React.useEffect(() => {
    if (active === undefined) {
      if (!ref.current) return;
      const obs = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) {setVisible(true);obs.disconnect();}
      }, { threshold: 0.2 });
      obs.observe(ref.current);
      return () => obs.disconnect();
    }
  }, [active]);

  React.useEffect(() => {
    if (active === undefined) return;
    if (active) {
      const t = setTimeout(() => setVisible(true), 120);
      return () => clearTimeout(t);
    } else {
      setVisible(false);
    }
  }, [active]);

  const words = text.split(' ');

  return (
    <span ref={ref} className={className} style={{ display: 'inline', ...style }}>
      {words.map((w, i) =>
      <span
        key={i}
        className={`blur-word${visible ? ' is-visible' : ''}`}
        style={{ transitionDelay: `${i * stagger}ms` }}>
          {w}
        </span>
      )}
    </span>);
}

          <div className="flex items-center gap-4">
            <span>TP HCM · VN</span>
            <span className="w-1 h-1 rounded-full bg-white/30"></span>
            <span>Available for freelance</span>
          </div>
        </div>
      </div>
    </div>);
}

const TOTAL = 4;
const SLIDE_LABELS = ['Home', 'About', 'Work', 'Contact'];

function App() {
  const [current, setCurrent] = React.useState(0);
  const transRef = React.useRef(false);
  const [, force] = React.useState(0);
  const slideRefs = React.useRef([]);
  const videoRefs = React.useRef([]);
  const rafRef = React.useRef(null);
  const touchStartRef = React.useRef(null);

  React.useEffect(() => {
    if (videoRefs.current[0]) {
      videoRefs.current[0].currentTime = 0;
      videoRefs.current[0].play().catch(() => {});
    }
  }, []);

  const goTo = React.useCallback((target) => {
    if (transRef.current) return;
    if (target === current) return;
    const fromIdx = current;
    const toIdx = (target % TOTAL + TOTAL) % TOTAL;
    const fromEl = slideRefs.current[fromIdx];
    const toEl = slideRefs.current[toIdx];
    if (!fromEl || !toEl) return;
    transRef.current = true;
    force((n) => n + 1);

    const nextVid = videoRefs.current[toIdx];
    if (nextVid) {
      try {nextVid.currentTime = 0;} catch (_) {}
      nextVid.play().catch(() => {});
    }

    const t0 = performance.now();
    const dur = 600;
    function tick(now) {
      const p = Math.min((now - t0) / dur, 1);
      const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
      fromEl.style.opacity = String(1 - e);
      toEl.style.opacity = String(e);
      if (p < 1) {rafRef.current = requestAnimationFrame(tick);} else {
        fromEl.style.opacity = '0';
        toEl.style.opacity = '1';
        const prevVid = videoRefs.current[fromIdx];
        if (prevVid) prevVid.pause();
        transRef.current = false;
        setCurrent(toIdx);
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }, [current]);

  const advance = React.useCallback(() => {
    goTo((current + 1) % TOTAL);
  }, [current, goTo]);

  function handleClick(e) {
    if (e.target.closest && e.target.closest('a, button, [data-no-advance]')) return;
    advance();
  }

  React.useEffect(() => {
    function onKey(e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        goTo((current + 1) % TOTAL);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goTo((current - 1 + TOTAL) % TOTAL);
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        goTo(parseInt(e.key, 10) - 1);
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [current, goTo]);

  React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  const slides = [
  <HeroSlide vidRef={(el) => videoRefs.current[0] = el} active={current === 0} />,
  <AboutSlide vidRef={(el) => videoRefs.current[1] = el} active={current === 1} />,
  <WorkSlide vidRef={(el) => videoRefs.current[2] = el} active={current === 2} />,
  <ContactSlide vidRef={(el) => videoRefs.current[3] = el} active={current === 3} />];

  return (
    <div
      style={{ position: 'fixed', inset: 0, overflow: 'hidden', cursor: 'pointer', touchAction: 'manipulation' }}
      onClick={handleClick}
      onTouchStart={(e) => {
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }}
      onTouchEnd={(e) => {
        if (!touchStartRef.current) return;
        const dx = Math.abs(e.changedTouches[0].clientX - touchStartRef.current.x);
        const dy = Math.abs(e.changedTouches[0].clientY - touchStartRef.current.y);
        touchStartRef.current = null;
        if (dx < 10 && dy < 10) {
          e.preventDefault();
          handleClick(e);
        }
      }}>

      <Navbar goTo={goTo} />

      {slides.map((slide, i) =>
      <div key={i}
      ref={(el) => slideRefs.current[i] = el}
      style={{
        position: 'absolute',
        inset: 0,
        opacity: i === 0 ? 1 : 0,
        pointerEvents: i === current ? 'auto' : 'none',
        willChange: 'opacity'
      }}>
          {slide}
        </div>
      )}

      <div data-no-advance style={{ position: 'fixed', top: '24px', left: '28px', zIndex: 250, pointerEvents: 'none' }}>
        <div className="lg rounded px-3 py-1.5 inline-flex items-baseline gap-2">
          <span className="font-heading italic text-white text-lg leading-none">{String(current + 1).padStart(2, '0')}</span>
          <span className="font-body font-light text-white/45 text-[10px] tracking-[0.2em] uppercase">/ {String(TOTAL).padStart(2, '0')} · {SLIDE_LABELS[current]}</span>
        </div>
      </div>

      <div style={{ position: 'fixed', bottom: '28px', left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: '8px', zIndex: 500, pointerEvents: 'none' }}>
        {Array.from({ length: TOTAL }).map((_, i) =>
        <div key={i} style={{
          height: '6px',
          borderRadius: '99px',
          background: i === current ? 'white' : 'rgba(255,255,255,0.25)',
          width: i === current ? '28px' : '6px',
          transition: 'all 0.35s ease'
        }} />
        )}
      </div>

      {current === 0 &&
      <div className="hint-pulse" style={{ position: 'fixed', bottom: '52px', right: '36px', zIndex: 500, pointerEvents: 'none' }}>
          <span style={{ fontFamily: 'Barlow', fontSize: '11px', color: 'rgba(255,255,255,0.55)', letterSpacing: '0.18em', textTransform: 'uppercase' }}>
            tap to explore  →
          </span>
        </div>
      }
    </div>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
